name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify release version
        run: |
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; const p=JSON.parse(await readFile('./package.json', 'utf8')); const tag=process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (p.version !== tag) { throw new Error('package.json version ' + p.version + ' does not match tag ' + process.env.GITHUB_REF_NAME); }"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build documentation
        run: npm run docs:build

      - name: Publish documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/.vitepress/dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy documentation for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
